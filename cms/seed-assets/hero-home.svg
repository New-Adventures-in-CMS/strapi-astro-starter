<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="polyA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="polyB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="polyC" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <polygon points="0,300 900,60 1120,660 0,900" fill="url(#polyA)" opacity="0.75"/>
  <polygon points="1600,0 1600,720 720,1000 960,180" fill="url(#polyB)" opacity="0.9"/>
  <polygon points="600,1000 1200,760 1600,1000" fill="url(#polyC)" opacity="0.85"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
