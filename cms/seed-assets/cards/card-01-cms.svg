<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="noise1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>

  <!-- Angular polygons -->
  <polygon points="0,0 180,0 140,120 0,80" fill="#242424" opacity="0.6"/>
  <polygon points="600,400 420,400 460,280 600,320" fill="#2a2a2a" opacity="0.5"/>
  <polygon points="150,100 350,80 320,200 140,220" fill="#1f1f1f" opacity="0.7"/>

  <!-- Accent element -->
  <polygon points="400,50 550,80 520,200 380,170" fill="#3a3a3a" opacity="0.4"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise1)"/>
</svg>
