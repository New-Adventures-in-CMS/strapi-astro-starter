<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#242424;stop-opacity:1" />
    </linearGradient>
    <filter id="noise6">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg6)"/>

  <!-- Staggered parallel planes -->
  <polygon points="0,0 250,0 280,120 0,100" fill="#242424" opacity="0.6"/>
  <polygon points="200,100 500,80 550,240 220,260" fill="#1f1f1f" opacity="0.5"/>
  <polygon points="0,300 400,280 420,400 0,400" fill="#2a2a2a" opacity="0.7"/>

  <!-- Right accent -->
  <polygon points="450,0 600,20 600,250 400,200" fill="#2f2f2f" opacity="0.4"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise6)"/>
</svg>
