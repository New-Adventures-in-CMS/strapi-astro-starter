<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f1f1f;stop-opacity:1" />
    </linearGradient>
    <filter id="noise8">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg8)"/>

  <!-- Editorial left-right split -->
  <polygon points="0,0 300,0 280,150 0,130" fill="#242424" opacity="0.7"/>
  <polygon points="300,0 600,0 600,120 320,140" fill="#1f1f1f" opacity="0.5"/>
  <polygon points="0,150 250,130 280,400 0,400" fill="#2a2a2a" opacity="0.6"/>
  <polygon points="350,140 600,120 600,400 380,400" fill="#2f2f2f" opacity="0.4"/>

  <!-- Central divider accent -->
  <polygon points="280,0 320,0 320,400 280,400" fill="#3a3a3a" opacity="0.2"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise8)"/>
</svg>
