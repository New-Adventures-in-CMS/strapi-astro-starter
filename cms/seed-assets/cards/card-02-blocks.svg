<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f1f1f;stop-opacity:1" />
    </linearGradient>
    <filter id="noise2">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>

  <!-- Angular polygons for block composition -->
  <polygon points="600,0 400,0 450,130 600,100" fill="#2a2a2a" opacity="0.6"/>
  <polygon points="0,400 200,400 150,270 0,300" fill="#242424" opacity="0.5"/>
  <polygon points="200,150 450,120 480,280 220,310" fill="#1f1f1f" opacity="0.7"/>

  <!-- Accent vertical stripe -->
  <polygon points="300,0 350,0 340,400 290,400" fill="#2f2f2f" opacity="0.3"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise2)"/>
</svg>
