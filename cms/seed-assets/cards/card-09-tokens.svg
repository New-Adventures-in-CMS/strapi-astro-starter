<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#242424;stop-opacity:1" />
    </linearGradient>
    <filter id="noise9">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg9)"/>

  <!-- Radial token-inspired composition -->
  <polygon points="300,0 450,100 400,250 300,300 200,250 150,100" fill="#242424" opacity="0.6"/>
  <polygon points="50,100 150,50 200,200 100,250" fill="#1f1f1f" opacity="0.5"/>
  <polygon points="500,100 600,50 600,200 520,250" fill="#2a2a2a" opacity="0.7"/>
  <polygon points="100,300 500,250 600,400 0,400" fill="#2f2f2f" opacity="0.4"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise9)"/>
</svg>
