<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f1f1f;stop-opacity:1" />
    </linearGradient>
    <filter id="noise5">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>

  <!-- Triangular composition -->
  <polygon points="0,0 300,0 150,250 0,200" fill="#2a2a2a" opacity="0.6"/>
  <polygon points="300,0 600,0 600,200 350,180" fill="#1f1f1f" opacity="0.5"/>
  <polygon points="0,250 200,200 300,400 0,400" fill="#242424" opacity="0.7"/>
  <polygon points="400,180 600,200 600,400 350,400" fill="#2f2f2f" opacity="0.4"/>

  <!-- Central accent -->
  <polygon points="200,150 400,100 450,300 250,320" fill="#3a3a3a" opacity="0.3"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise5)"/>
</svg>
