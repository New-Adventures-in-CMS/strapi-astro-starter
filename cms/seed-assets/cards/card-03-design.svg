<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#242424;stop-opacity:1" />
    </linearGradient>
    <filter id="noise3">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>

  <!-- Grid-inspired angular composition -->
  <polygon points="0,0 200,0 180,150 0,130" fill="#2a2a2a" opacity="0.5"/>
  <polygon points="400,0 600,0 600,180 370,150" fill="#242424" opacity="0.6"/>
  <polygon points="0,250 150,200 180,400 0,400" fill="#1f1f1f" opacity="0.7"/>
  <polygon points="450,250 600,200 600,400 500,400" fill="#2f2f2f" opacity="0.4"/>

  <!-- Central diamond accent -->
  <polygon points="300,100 400,200 300,300 200,200" fill="#3a3a3a" opacity="0.3"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise3)"/>
</svg>
