<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0e0e0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="noise4">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>

  <!-- Layered horizontal bands -->
  <polygon points="0,80 600,60 600,150 0,170" fill="#242424" opacity="0.5"/>
  <polygon points="0,250 600,220 600,330 0,350" fill="#1f1f1f" opacity="0.6"/>

  <!-- Accent diagonals -->
  <polygon points="100,0 250,0 150,200 0,180" fill="#2a2a2a" opacity="0.4"/>
  <polygon points="500,200 600,150 600,400 450,400" fill="#3a3a3a" opacity="0.3"/>

  <!-- Subtle noise overlay -->
  <rect width="600" height="400" fill="#1a1a1a" opacity="0.05" filter="url(#noise4)"/>
</svg>
